{% extends "base.html" %}
{% load crispy_forms_tags %}
{% block content %}
{# Assisted by OpenAI Codex. #}
<section class="content-section">
  <h2>{% if script %}Edit script{% else %}New script{% endif %}</h2>
  <form method="post">{% csrf_token %}{{ form|crispy }}
    <button type="submit" class="btn btn-primary">Save script</button>
    <a href="{% url 'script-list' %}">Cancel</a>
  </form>
</section>
{% endblock content %}
